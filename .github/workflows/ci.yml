name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Route types for every app, then types, lint and tests for every workspace (packages/core and apps/*).
      - run: npm run typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
