name: Alerts

# Vercel's free cron runs once a day, so this asks the three apps every 30 minutes to send any new alerts and refresh
# their saved copies of the data. One repository secret, CRON_SECRET, with the same value as CRON_SECRET in each of
# the three Vercel projects. If the secret is missing or does not match, the run says so and stays green.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask each app to check for alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET is not set in the repository secrets"; exit 0; fi
          for app in fire flood air; do
            for job in alerts backup; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "https://$app.noahwaseaten.com/api/cron/$job" || echo 000)
              case "$code" in
                2*) echo "$app $job: ok" ;;
                401) echo "::warning::$app: CRON_SECRET in Vercel does not match the GitHub secret" ;;
                *) echo "::warning::$app $job answered $code" ;;
              esac
            done
          done
