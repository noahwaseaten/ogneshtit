name: Alerts

# Vercel's free cron runs once a day, so this checks for new danger, fires and warnings every
# 30 minutes. Needs the repository secret CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the alert check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set"; exit 0; fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://ogneshtit.noahwaseaten.com/api/cron/alerts
