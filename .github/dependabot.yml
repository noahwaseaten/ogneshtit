version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Sofia
    # Few, grouped pull requests: each one is a branch, and Vercel skips dependabot branches (vercel.json).
    open-pull-requests-limit: 2
    ignore:
      # Node types follow the runtime (Node 22/24 on Vercel), and ESLint majors wait for eslint-config-next.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
